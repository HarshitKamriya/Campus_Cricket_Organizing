services:
  - type: web
    name: campus-cricket-backend
    env: node
    plan: free
    buildCommand: "cd backend && npm install"
    startCommand: "cd backend && npm start"
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-cricket-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false # You will need to set this to your frontend URL manually
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: campus-cricket-db
    databaseName: cricketdb
    user: cricketadmin
    plan: free
